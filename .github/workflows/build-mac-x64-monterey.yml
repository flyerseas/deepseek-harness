name: Build Desktop · macOS x64 (Monterey)

on:
  workflow_dispatch:
  push:
    branches: [macos12-electron43]
    paths-ignore:
      - '.github/workflows/**'

permissions:
  contents: write

concurrency:
  group: build-mac-x64-monterey
  cancel-in-progress: true

jobs:
  package:
    # Public repositories use GitHub-hosted standard runners free and unlimited.
    # macos-15-intel is the free Intel (x86_64) standard runner; macos-13 was retired on 2025-12-04.
    runs-on: macos-15-intel
    timeout-minutes: 240
    defaults:
      run:
        shell: bash
    env:
      DSH_TELEMETRY_DISABLED: '1'
      TARGET_MINOS: '12.0'
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v5.0.0
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'
      - name: Host info
        run: sw_vers; uname -m; node -v; pnpm -v; xcodebuild -version || true; python3 --version
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Rebuild require-builtin for macOS 12
        run: bash .github/monterey/rebuild-require-builtin-macos12.sh
      - name: Lower minos on optional natives (sherpa-onnx)
        run: bash .github/monterey/lower-optional-natives-macos12.sh
      - name: Check packaging configuration and toolchain
        run: pnpm run package:desktop:mac:x64:unsigned --check
      - name: Build unsigned x64 installers
        run: pnpm run package:desktop:mac:x64:unsigned
      # prepare-dsh reinstalls into a fresh temp tree, so node_modules patches above
      # do not reach the final app. Re-extract the DMG, inject the rebuilt
      # require-builtin + lower sherpa minos, then rewrite the DMG.
      - name: Patch natives inside packaged DMG
        run: bash .github/monterey/repack-dmg-macos12.sh
      - name: List artifacts
        if: always()
        run: find apps/desktop/.desktop-build/targets/mac-x64 -maxdepth 3 \( -name '*.dmg' -o -name '*.zip' -o -name '*.app' \) -print -exec ls -ld {} \; || true
      - name: Scan Mach-O minimum macOS versions
        id: scan
        run: bash .github/monterey/scan-dmg-macos12.sh
      - name: Upload unsigned DMG
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: dsh-desktop-mac-x64-monterey-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            apps/desktop/.desktop-build/targets/mac-x64/**/*.dmg
            scan-out/
          compression-level: 0
          if-no-files-found: warn
          retention-days: 14
      - name: Publish DMG as a public release
        if: success()
        run: |
          set -euo pipefail
          dmgs=()
          while IFS= read -r file; do dmgs+=("$file"); done < <(find apps/desktop/.desktop-build/targets/mac-x64 -type f -name '*.dmg' | sort)
          if [ "${#dmgs[@]}" -eq 0 ]; then echo '::error::No unsigned x64 DMG was produced'; exit 1; fi
          tag="monterey-x64-${{ github.run_number }}"
          gh release create "$tag" "${dmgs[@]}" --target "${{ github.sha }}" \
            --title "DeepSeek Harness · macOS 12 Monterey · Intel x64 (#${{ github.run_number }})" \
            --notes "Built from the official deepseek-ai/deepseek-harness fork with Electron 43.0.0 on the free GitHub-hosted macos-15-intel standard runner. Unsigned/ad-hoc signed DMG for Intel Macs running macOS 12.x. No paid runner, no Apple Developer certificate, no notarization."
          release_url=$(gh release view "$tag" --json url -q .url)
          echo "RELEASE_URL=$release_url" >> "$GITHUB_ENV"
          echo "DMG published: $release_url" >> "$GITHUB_STEP_SUMMARY"
          echo "Download the DMG from $release_url"
      - name: Upload packaging diagnostics
        if: failure()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: packaging-logs-${{ github.run_id }}-${{ github.run_attempt }}
          include-hidden-files: true
          path: apps/desktop/.desktop-build/packaging-runs/
          if-no-files-found: warn
          retention-days: 7
